name: Build INDI for Raspberry Pi OS Bookworm

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04-arm # Use native ARM64 runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Docker is Running
        run: |
          sudo systemctl start docker || true
          docker --version

      - name: Pull Raspberry Pi OS Bookworm Docker
        run: |
          docker pull dtcooper/raspberrypi-os:latest

      - name: Build INDI inside Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace dtcooper/raspberrypi-os:latest bash -c "
            sudo apt update && sudo apt install -y software-properties-common &&
            apt-add-repository ppa:mutlaqja/ppa &&
            apt update &&
            apt-get install -y \
            git \
            cdbs \
            dkms \
            cmake \
            fxload \
            libev-dev \
            libgps-dev \
            libgsl-dev \
            libraw-dev \
            libusb-dev \
            zlib1g-dev \
            libftdi-dev \
            libjpeg-dev \
            libkrb5-dev \
            libnova-dev \
            libtiff-dev \
            libfftw3-dev \
            librtlsdr-dev \
            libcfitsio-dev \
            libgphoto2-dev \
            build-essential \
            libusb-1.0-0-dev \
            libdc1394-dev \
            libboost-regex-dev \
            libcurl4-gnutls-dev \
            libtheora-dev &&
            git clone --depth=1 https://github.com/indilib/indi.git &&
            mkdir -p indi/build && cd indi/build &&
            cmake .. &&
            make -j$(nproc)
          "

      - name: Save INDI binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: indi-binaries
          path: |
            indi/build/bin/
            indi/build/lib/
