name: Build INDI for Raspberry Pi OS Bookworm

on: [push, pull_request]

jobs:
  check:
    name: Check Version
    runs-on: ubuntu-latest

    outputs:
      versionINDI: ${{ steps.fetch_tags.outputs.indi }}
      versionINDI3rdPARTY: ${{ steps.fetch_tags.outputs.indi-3rdparty }}
      versionKStars: ${{ steps.fetch_tags.outputs.kstars }}
      versionLibXISF: ${{ steps.fetch_tags.outputs.libXISF }}
      versionStellarSolver: ${{ steps.fetch_tags.outputs.stellarsolver }}
      needs_update: ${{ steps.fetch_tags.outputs.needs_update }}
    steps:
      - name: Restore
        id: load_cache_release
        uses: actions/cache@v4
        with:
          path: latest_releases.json
          key: release-tags-${{ github.run_id }}
          restore-keys: release-tags-
      - name: Fetch latest tags
        id: fetch_tags
        run: |
          REPOS=("indilib/indi" "indilib/indi-3rdparty" "rlancaste/stellarsolver" "joxda/libXISF")
          echo "repos=${REPOS[*]}" >> $GITHUB_ENV

          echo "{" > new_releases.json
          NEEDS_UPDATE=false
          RAN=false
          #if [ ! -f latest_releases.json ]; then
            echo "{}" > latest_releases.json
          #fi
          for repo in ${REPOS[*]}; do
            if [ "$RAN" = "true" ]; then
              echo "," >> new_releases.json
            fi
            RAN=true
            LATEST_TAG=$(curl -s https://api.github.com/repos/$repo/releases/latest | jq -r .tag_name)
            PREVIOUS_TAG=$(jq -r --arg rep "$repo" '.[$rep] // ""' latest_releases.json)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG=$(curl -s https://api.github.com/repos/$repo/tags | jq -r '.[0].name')
            fi
            if [ "$LATEST_TAG" = "null" ]; then
              LATEST_TAG=$(curl -s https://api.github.com/repos/$repo/tags | jq -r '.[0].name')
            fi
            echo "${repo#*/}=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "Previous release for $repo(${repo#*/}): $PREVIOUS_TAG"
            if [ "$LATEST_TAG" != "$PREVIOUS_TAG" ]; then
              echo "New release detected for $repo: $LATEST_TAG"
              NEEDS_UPDATE=true
            fi
            echo "    \"$repo\": \"$LATEST_TAG\"" >> new_releases.json
          done
          LATEST_TAG=$(git ls-remote -h https://invent.kde.org/kde/kstars.git | grep '\/stable-*' | tail -n1 | sed 's/\// /g' | awk '{print $4}')
          PREVIOUS_TAG=$(jq -r --arg rep "kstars" '.[$rep] // ""' latest_releases.json)
          echo -n "    \"kstars\": \"$LATEST_TAG\"" >> new_releases.json
          echo "}" >> new_releases.json

          if [ "$LATEST_TAG" != "$PREVIOUS_TAG" ]; then
            echo "New release detected for kstars: $LATEST_TAG"
            NEEDS_UPDATE=true
          fi
          echo "kstars=$LATEST_TAG" >> $GITHUB_OUTPUT

          echo "needs_update=$NEEDS_UPDATE" >> $GITHUB_OUTPUT
          if [ "$NEEDS_UPDATE" = "true" ]; then
            mv new_releases.json latest_releases.json
          fi

  build:
    needs: check
    runs-on: ubuntu-24.04-arm # Use native ARM64 runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Docker is Running
        run: |
          sudo systemctl start docker || true
          docker --version

      - name: Pull Raspberry Pi OS Bookworm Docker
        run: |
          docker pull dtcooper/raspberrypi-os:latest

      - name: Build inside Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace dtcooper/raspberrypi-os:latest bash -c "
            apt update &&
            apt-get install -y \
            git \
            cdbs \
            dkms \
            cmake \
            fxload \
            libev-dev \
            libgps-dev \
            libgsl-dev \
            libraw-dev \
            libusb-dev \
            zlib1g-dev \
            libftdi-dev \
            libjpeg-dev \
            libkrb5-dev \
            libnova-dev \
            libtiff-dev \
            libfftw3-dev \
            librtlsdr-dev \
            libcfitsio-dev \
            libgphoto2-dev \
            build-essential \
            libusb-1.0-0-dev \
            libdc1394-dev \
            libboost-regex-dev \
            libcurl4-gnutls-dev \
            libtheora-dev \
            libboost-dev libboost-regex-dev librtlsdr-dev liblimesuite-dev libftdi1-dev libavcodec-dev libavdevice-dev &&
            #git clone --depth 1 https://github.com/joxda/libXISF.git &&
            #git switch -d --discard-changes ${{ needs.check.outputs.versionLibXISF }} &&
            #mkdir -p libXISF/build && cd libXISF/build &&
            #echo 'include(CPack)' >> ../CMakeLists.txt &&
            #cmake -DCMAKE_BUILD_TYPE=Release  -DCPACK_GENERATOR=TGZ -DCPACK_PACKAGE_NAME=libXISF -DCPACK_PACKAGE_VERSION=${{ needs.check.outputs.versionLibXISF }} -DCPACK_PACKAGE_CONTACT="joxda@github" .. &&
            #make -j$(nproc) &&
            #make install &&
            #cpack -G TGZ &&
            #cp *tar.gz /workspace &&
            #cd ../.. &&
            git clone --depth=1 https://github.com/indilib/indi.git &&
            git switch -d --discard-changes ${{ needs.check.outputs.versionINDI }} &&
            mkdir -p indi/build && cd indi/build &&
            echo 'include(CPack)' >> ../CMakeLists.txt &&
            cmake  -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DCPACK_GENERATOR=TGZ -DCPACK_PACKAGE_NAME=indi -DCPACK_PACKAGE_VERSION=${{ needs.check.outputs.versionINDI }} -DCPACK_PACKAGE_CONTACT="joxda@github" .. &&
            make -j$(nproc) &&
            cpack -G TGZ &&
            cp *tar.gz /workspace &&
            cd ../.. &&
            git clone --depth=1 https://github.com/indilib/indi-3rd-party.git &&
            git switch -d --discard-changes ${{ needs.check.outputs.versionINDI3rdPARTY }} &&
            mkdir -p indi-3rd-party/build/indi-lib/ && cd indi-3rd-party/build/indi-lib &&
            echo 'include(CPack)' >> ../../CMakeLists.txt &&
            cmake  -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_LIBS=1 -DCMAKE_BUILD_TYPE=Release -DCPACK_GENERATOR=TGZ -DCPACK_PACKAGE_NAME=indi-lib -DCPACK_PACKAGE_VERSION=${{ needs.check.outputs.versionINDI3rdPARTY }} -DCPACK_PACKAGE_CONTACT="joxda@github" ../.. &&
            make -j$(nproc) &&
            cpack -G TGZ &&
            cp *tar.gz /workspace
            mkdir ../indi-3rd-party &&
            cmake  -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DCPACK_GENERATOR=TGZ -DCPACK_PACKAGE_NAME=indi-3rd-party -DCPACK_PACKAGE_VERSION=${{ needs.check.outputs.versionINDI3rdPARTY }} -DCPACK_PACKAGE_CONTACT="joxda@github" ../.. &&
            make -j$(nproc) &&
            cpack -G TGZ &&
            cp *tar.gz /workspace &&
            cd ../../.. &&
            git clone --depth 1 https://github.com/rlancaste/stellarsolver.git &&
            git switch -d --discard-changes ${{ needs.check.outputs.versionStellarSolver }} &&
            mkdir stellarsolver/build && cd stellarsolver/build &&
            echo 'include(CPack)' >> ../CMakeLists.txt &&
            cmake .. -DCMAKE_BUILD_TYPE=Release  -DCPACK_GENERATOR=TGZ -DCPACK_PACKAGE_NAME=StellarSolver -DCPACK_PACKAGE_VERSION=${{ needs.check.outputs.versionStellarSolver }} -DCPACK_PACKAGE_CONTACT="joxda@github"  &&
            make -j$(nproc) &&
            cpack -G TGZ &&
            cp *tar.gz /workspace
          "
      - name: Save packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: copy packages
          path: |
            ${{ github.workspace }}/*tar.gz
