
table inet wifi {

  set auth_macs {
    type ether_addr
    flags timeout
    timeout 8h
  }

  chain input {
    type filter hook input priority 0;

    ct state established,related accept
    iif lo accept

    # DHCP & DNS
    iif "wlan0" udp dport {53, 67, 68} accept

    # HTTPS portal
    iif "wlan0" tcp dport 443 accept

    # indiserver (MAC-authenticated only)
    iif "wlan0" tcp dport 7624 ether saddr @auth_macs accept

    # Drop all other Wi-Fi traffic
    iif "wlan0" drop

    accept
  }
}
